<!--
  Self-portrait for the home page intro. Monoline (1.5px, round caps and joins).
  Hair, bun, irises and mustache are solid; thin background-colored lines cut
  the strands, hair tie and catchlights into them. The mustache shape is adapted
  from the "Mustache" icon on SVG Repo (www.svgrepo.com), scaled into place and
  redrawn as absolute coordinates.

  Theming: everything draws in currentColor, so set CSS `color` to the ink token
  on the svg. The cut lines and the knockout under the mustache use the page
  background custom property, so the mustache sits in front of the face lines it
  crosses. Both follow dark mode. (No double hyphens in this comment: they make
  the file invalid XML.)

  Interaction: #mustache is self-contained. The face and smile are drawn complete
  underneath it, so moving, rotating or scaling the group never exposes a gap.
  transform-box/transform-origin make CSS transforms pivot under the nose.
  The transparent rect gives the group one continuous hit area.
  If it becomes clickable, put the behaviour on a real <button> around the SVG or
  give #mustache tabindex="0" role="button" and an aria-label.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480"
  role="img" aria-labelledby="portrait-title portrait-desc"
  fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <title id="portrait-title">Mal Nushi</title>
  <desc id="portrait-desc">Line drawing of a smiling man with dark hair with his hair tied up in a bun and a large, curled handlebar mustache.</desc>

  <g id="torso">
    <path d="M178,326 C180,344 178,358 174,368"/>
    <path d="M222,326 C220,344 222,358 226,368"/>
    <path d="M174,368 C146,380 104,388 80,404 C62,416 56,446 54,480"/>
    <path d="M226,368 C254,380 296,388 320,404 C338,416 344,446 346,480"/>
    <path d="M166,374 C178,394 222,394 234,374"/>
  </g>

  <g id="hair">
    <path fill="currentColor" d="M125,214 C116,160 150,110 200,110 C250,110 284,160 275,214 C273,212 272,210 272,208 C271,184 262,168 246,160 C232,153 216,151 200,152 C184,151 168,153 154,160 C138,168 129,184 128,208 C128,210 127,212 125,214 Z"/>
    <g id="bun">
      <path fill="currentColor" d="M179,108 C168,90 180,62 202,62 C224,62 234,88 221,108 C214,111 186,111 179,108 Z"/>
    </g>
    <g id="hair-strands" style="stroke: var(--bg, #fafafa);" stroke-width="1.25">
      <path d="M158,153 C164,138 176,126 192,118"/>
      <path d="M214,148 C211,136 207,127 203,119"/>
      <path d="M242,153 C236,138 224,126 208,118"/>
      <path d="M186,82 C197,83 209,92 213,102"/>
      <path d="M194,69 C205,72 215,81 218,92"/>
      <path stroke-width="2" d="M183,106 C194,109.5 206,109.5 217,106"/>
    </g>
  </g>

  <g id="face">
    <path d="M127,206 C126,252 136,288 158,312 C172,327 186,334 200,334 C214,334 228,327 242,312 C264,288 274,252 273,206"/>
    <g id="ears">
      <path d="M127,208 C114,200 106,214 110,230 C113,244 120,252 129,250"/>
      <path d="M118,218 C116,226 118,234 122,238"/>
      <path d="M273,208 C286,200 294,214 290,230 C287,244 280,252 271,250"/>
      <path d="M282,218 C284,226 282,234 278,238"/>
    </g>
    <g id="brows" stroke-width="2">
      <path d="M150,198 C160,190 174,189 186,194"/>
      <path d="M214,194 C226,189 240,190 250,198"/>
    </g>
    <g id="eyes">
      <path d="M154,221 C160,212 176,212 184,220"/>
      <path d="M158,225 C165,228 175,228 181,224"/>
      <path fill="currentColor" d="M164.8,214.6 A5.5,5.5 0 1,0 173.2,214.6 Z"/>
      <circle cx="171.2" cy="217" r="1.3" stroke="none" style="fill: var(--bg, #fafafa);"/>
      <path d="M216,220 C224,212 240,212 246,221"/>
      <path d="M219,224 C225,228 235,228 242,225"/>
      <path fill="currentColor" d="M226.8,214.6 A5.5,5.5 0 1,0 235.2,214.6 Z"/>
      <circle cx="233.2" cy="217" r="1.3" stroke="none" style="fill: var(--bg, #fafafa);"/>
      <path d="M145,223 C142,225 141,228 142,231"/>
      <path d="M255,223 C258,225 259,228 258,231"/>
    </g>
    <path id="nose" d="M197,226 C196,242 189,254 189,262 C189,268 194,271 200,271 C206,271 211,268 211,262"/>
    <g id="smile">
      <path d="M182,302 C189,316 211,316 218,302"/>
      <path d="M192,323 C197,325 203,325 208,323"/>
    </g>
  </g>

  <g id="mustache" style="transform-box: fill-box; transform-origin: 50% 20%;">
    <rect x="110" y="262" width="180" height="60" fill="none" stroke="none" pointer-events="all"/>
    <path style="stroke: var(--bg, #fafafa);" stroke-width="6" d="M281.4,289.4 C281.4,289.4 276.4,296.6 267,296 C257.6,295.5 247.6,279.1 228.8,273.9 C210,268.8 200,277 200,277 C200,277 190,268.8 171.2,273.9 C152.4,279.1 142.4,295.5 133,296 C123.6,296.6 118.6,289.4 118.6,289.4 C118.6,289.4 115.5,295.5 124.3,304.3 C133,313 157.4,316.7 173.1,313 C190.6,308.9 200,298.6 200,298.6 C200,298.6 208.8,309.4 226.9,313 C242.7,316.2 267,313 275.7,304.3 C284.5,295.5 281.4,289.4 281.4,289.4 Z"/>
    <path fill="currentColor" stroke="none" d="M281.4,289.4 C281.4,289.4 276.4,296.6 267,296 C257.6,295.5 247.6,279.1 228.8,273.9 C210,268.8 200,277 200,277 C200,277 190,268.8 171.2,273.9 C152.4,279.1 142.4,295.5 133,296 C123.6,296.6 118.6,289.4 118.6,289.4 C118.6,289.4 115.5,295.5 124.3,304.3 C133,313 157.4,316.7 173.1,313 C190.6,308.9 200,298.6 200,298.6 C200,298.6 208.8,309.4 226.9,313 C242.7,316.2 267,313 275.7,304.3 C284.5,295.5 281.4,289.4 281.4,289.4 Z"/>
  </g>
</svg>
