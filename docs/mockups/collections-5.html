<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>/collections mockup · round five, the shelf</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&family=Google+Sans+Flex&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafafa;--surface:#edeeeb;--ink:#2e2e2e;--ink-2:#626964;--link:#485861;--accent:#626e5e;--line:#d5d7d2;
 --sage7:#4d5749;--on-sage:#fafafa;--on-sage-2:#edeeeb;
 --open:cubic-bezier(.34,1.25,.5,1);--close:cubic-bezier(.3,0,.3,1)}
@media (prefers-color-scheme:dark){:root{--bg:#2e2e2e;--surface:#3d444c;--ink:#edeeeb;--ink-2:#a4ada6;--link:#d2dde4;--accent:#758072;--line:#485861}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Google Sans Flex",system-ui,sans-serif}
a{color:inherit;text-decoration:none}
.wrap{max-width:1344px;margin:0 auto;padding:0 48px 128px}
.nav{height:104px;display:flex;align-items:center;justify-content:center}
.nav div{width:600px;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:var(--ink-2)}
.nav b{font:400 24px Newsreader,serif;color:var(--ink)}
.chrome{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 48px;display:flex;gap:8px;align-items:center;font:12px "JetBrains Mono"}
.chrome span{color:var(--ink-2);margin-right:8px}
.pill{height:32px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--ink);font:13px "Google Sans Flex";cursor:pointer}
.pill:hover{border-color:var(--ink-2)}
.pill[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chrome em{margin-left:auto;font-style:normal;color:var(--ink-2)}
.label{font:12px/1.5 "Google Sans Flex";letter-spacing:1.44px;text-transform:uppercase;color:var(--ink-2)}
.meta{font:13px/1.7 "JetBrains Mono",monospace;color:var(--ink-2)}
header.page{padding-top:120px;display:flex;flex-direction:column;gap:24px}
header h1{font:400 88px/1.02 Newsreader,serif;letter-spacing:-2.2px}
header p.sf{font:400 24px/1.45 Newsreader,serif;color:var(--ink-2);max-width:600px}
.note{margin-top:64px;max-width:680px;font:14px/1.6 "Google Sans Flex";color:var(--ink-2);border-top:1px solid var(--ink);padding-top:16px}
.note b{font-weight:400;color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.controls{display:flex;gap:8px;margin:64px 0 24px;align-items:center}
.controls .label{margin-right:8px}

/* The shelf. One row of spines across the content width; the open one grows, the rest give way. */
.shelf{display:flex;gap:4px;height:520px;align-items:flex-end;border-bottom:1px solid var(--ink)}
.group{display:flex;flex-direction:column;gap:12px;flex:var(--n) 1 0;min-width:calc(var(--n) * 72px);height:100%;transition:flex-grow .35s var(--close)}
.group:has(.spine:is(:hover,:focus-visible)){flex-grow:calc(var(--n) + 4.2);transition:flex-grow .6s var(--open)}
.group>.label{padding-bottom:8px;border-bottom:1px solid var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.group>.row{flex:1;display:flex;gap:4px;align-items:flex-end;min-height:0}
.shelf.grouped{gap:24px;border-bottom:0}
.shelf.grouped .row{border-bottom:1px solid var(--ink)}
.spine{position:relative;flex:1 1 0;min-width:72px;height:var(--h,100%);display:flex;overflow:hidden;border-radius:4px 4px 0 0;
 background:color-mix(in srgb,var(--surface),var(--line) var(--tone,0%));color:var(--ink);
 transition:flex-grow .35s var(--close),height .35s var(--close),background-color .3s}
.spine .strip{flex:0 0 72px;width:72px;padding:20px 0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;position:relative}
.spine .strip .meta{color:inherit;opacity:.8}
.spine .nm{writing-mode:vertical-rl;font:400 32px/1 Newsreader,serif;letter-spacing:-.32px;white-space:nowrap}
.spine .tick{width:var(--tick,0px);height:2px;background:currentColor;opacity:.55}
.spine .foot{display:flex;flex-direction:column;align-items:center;gap:6px}
.spine .body{flex:0 0 340px;padding:20px 28px 20px 0;display:flex;flex-direction:column;justify-content:space-between;opacity:0;visibility:hidden;transition:opacity .15s,visibility .15s}
.spine .body .s{font:300 34px/1.15 Newsreader,serif;letter-spacing:-.4px;color:var(--on-sage)}
.spine .body .s b{font-weight:300}
.spine .body .l{font:12px/1.5 "Google Sans Flex";letter-spacing:1.44px;text-transform:uppercase;color:var(--on-sage-2);margin-bottom:12px}
.spine .body .meta{color:var(--on-sage-2)}
.spine .body ul{list-style:none;padding:0;margin-top:20px;display:flex;flex-direction:column;gap:6px}
.spine .body li{display:flex;gap:12px;border-top:1px solid color-mix(in srgb,var(--on-sage-2) 35%,transparent);padding-top:6px}
.spine:is(:hover,:focus-visible){flex-grow:5.2;height:100%;background:var(--sage7);color:var(--on-sage);transition:flex-grow .6s var(--open),height .6s var(--open),background-color .3s}
.spine:is(:hover,:focus-visible) .strip{flex-basis:96px;width:96px}
.spine:is(:hover,:focus-visible) .tick{opacity:.8}
.spine:is(:hover,:focus-visible) .body{opacity:1;visibility:visible;transition:opacity .35s .15s,visibility 0s}
.spine.soon .nm,.spine.soon .strip .meta{opacity:.5}
</style></head>
<body>
<div class="chrome"><span>/collections · round five</span>
 <span>Size cue:</span>
 <button class="pill" data-cue="none" aria-pressed="false">None</button>
 <button class="pill" data-cue="tick" aria-pressed="true">Tick</button>
 <button class="pill" data-cue="tone" aria-pressed="false">Tone</button>
 <button class="pill" data-cue="height" aria-pressed="false">Height</button>
 <em>Travels is real. The other nine are sample.</em></div>
<div class="wrap">
 <div class="nav"><div><span>Search</span><b>Mal Nushi</b><span>Menu</span></div></div>
 <header class="page">
  <p class="label">Collections</p>
  <h1>Collections</h1>
  <p class="sf">Lists I keep and numbers I keep counting. None of them is finished.</p>
 </header>
 <div class="controls" role="group" aria-label="Arrange the shelf"><span class="label">Shelve</span>
  <button class="pill" data-group="all" aria-pressed="true">All together</button>
  <button class="pill" data-group="kind" aria-pressed="false">By kind</button></div>
 <div id="shelf"></div>
 <p class="note" id="note"></p>
</div>
<script>
// Sample collections. Travels is real; the rest are placeholders for layout.
const C=[
 {g:0,n:"Travels",c:123,s:"I have flown <b>161,324 miles</b>.",l:"Since 2005 · 12 countries",e:[["16×","Charlotte – Detroit"],["8×","Pristina – Vienna"],["6×","Charlotte – New York"]]},
 {g:0,n:"City guides",c:9,s:"I have written guides to <b>9 cities</b>.",l:"Where I would take you",e:[["2026","Vienna"],["2025","Detroit"],["2024","Charlotte"]]},
 {g:0,n:"Life list",c:214,s:"I have named <b>214 birds</b>.",l:"58 families · since 2019",e:[["09-27","Carolina Wren"],["09-21","Great Blue Heron"],["09-02","Tufted Titmouse"]]},
 {g:0,n:"Plant tracker",c:37,s:"I am keeping <b>37 plants</b> alive.",l:"Indoors and the porch",e:[["09-30","Monstera"],["09-14","Pothos"],["08-22","Fiddle-leaf fig"]]},
 {g:1,n:"Recommendations",c:128,s:"I keep <b>128 things</b> worth sending a friend to.",l:"Books, films, tools, places",e:[["09-20","Braiding Sweetgrass"],["09-11","Piranesi"],["08-30","Paterson"]]},
 {g:1,n:"Reading list",c:86,s:"I have finished <b>86 books</b> since 2020.",l:"On the shelf and off it",e:[["09-24","Piranesi"],["09-01","The Overstory"],["08-12","Gilead"]]},
 {g:1,n:"Records",c:52,s:"I own <b>52 records</b>, and play most of them.",l:"Vinyl only",e:[["09-18","Kind of Blue"],["08-29","Rumours"],["08-02","Blue"]]},
 {g:1,n:"Recipes",c:31,s:"I cook from <b>31 recipes</b> I wrote down.",l:"Tested at least twice",e:[["09-26","Shakshuka"],["09-08","Focaccia"],["08-17","Dal"]]},
 {g:2,n:"Lego inventory",c:41,soon:1,s:"I have <b>41 Lego sets</b>, not yet written down.",l:"Not started",e:[["—","No sets yet"]]},
 {g:2,n:"Cameras",c:6,s:"I have used <b>6 cameras</b>.",l:"Film and digital",e:[["2026","Ricoh GR III"],["2022","Olympus OM-1"],["2019","Fujifilm X100"]]}
];
const G=["Places and nature","Taste","Things"], max=Math.max(...C.map(o=>o.c));
let grp="all", cue="tick";
// What a spine's number does to it. Each cue is one custom property; none is on by default except the tick.
const cueVars=o=>{const r=Math.sqrt(o.c/max);
 return cue==="tick"?`--tick:${Math.round(10+36*r)}px`
  :cue==="tone"?`--tone:${Math.round(r*70)}%`
  :cue==="height"?`--h:${Math.round(456+64*r)}px`:""};
const spine=(o,i)=>`<a class="spine${o.soon?' soon':''}" href="#" style="${cueVars(o)}">
 <div class="strip"><span class="meta">${String(i+1).padStart(3,'0')}</span><span class="nm">${o.n}</span>
  <span class="foot"><i class="tick"></i><span class="meta">${o.c}</span></span></div>
 <div class="body"><div><p class="l">${o.l}</p><p class="s">${o.s}</p><ul>${o.e.map(x=>`<li class="meta"><span>${x[0]}</span><span>${x[1]}</span></li>`).join('')}</ul></div><span class="meta">Open ${o.n.toLowerCase()} →</span></div></a>`;
function draw(){
 const el=document.getElementById('shelf');
 if(grp==="all")el.innerHTML=`<div class="shelf">${C.map(spine).join('')}</div>`;
 else el.innerHTML=`<div class="shelf grouped">${G.map((g,k)=>{const rows=C.map((o,i)=>[o,i]).filter(([o])=>o.g===k);
  return `<div class="group" style="--n:${rows.length}"><p class="label">${g}</p><div class="row">${rows.map(([o,i])=>spine(o,i)).join('')}</div></div>`}).join('')}</div>`;
 document.querySelectorAll('[data-group]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.group===grp));
 document.querySelectorAll('[data-cue]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.cue===cue));
 document.getElementById('note').innerHTML={
  none:"<b>No size cue.</b> The count at the foot of each spine is the only hint of size.",
  tick:"<b>Tick.</b> A short rule above each count, 10 to 46px, longer for a collection with more in it. The silhouette of the shelf stays flat, so it cannot read as a histogram; the cue is only readable if you look for it.",
  tone:"<b>Tone.</b> Each spine's fill steps a little deeper as it holds more, up to a 70% mix toward <code>line</code>. Even and quiet, but a fill difference this small may be lost in dark mode or on a poor screen.",
  height:"<b>Height.</b> Heights run over a 64px range instead of round four's 320px. Still a ragged top edge, so it is the one most likely to be read as a chart; shown so you can judge whether 64px is subtle enough."}[cue]+
  " Pressing <b>By kind</b> sets the shelf in three labelled groups on one row, each group keeping the fill behaviour; the selection would live in the address (<code>?shelve=kind</code>), as the Projects filters do.";
 try{if(/^(https?|file):/.test(location.protocol))history.replaceState(null,'',grp==="kind"?'?shelve=kind':location.pathname)}catch(e){}
}
document.addEventListener('click',e=>{
 const g=e.target.closest('[data-group]'),c=e.target.closest('[data-cue]');
 if(g){grp=g.dataset.group;draw()} if(c){cue=c.dataset.cue;draw()}
 if(e.target.closest('a[href="#"]'))e.preventDefault()});
try{if(new URLSearchParams(location.search).get('shelve')==='kind')grp='kind'}catch(e){}
draw();
</script></body></html>
